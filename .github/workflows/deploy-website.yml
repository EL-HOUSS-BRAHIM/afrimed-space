name: deploy-website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "deploy/**"
      - "scripts/deploy-website.sh"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-website
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: website
    steps:
      - uses: actions/checkout@v4
      - name: Publish to VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          mkdir -p bundle/site
          cp site/* bundle/site/
          cp deploy/Caddyfile.gateway deploy/compose.gateway.yaml bundle/
          name="website-$GITHUB_SHA-$GITHUB_RUN_ID.tar.gz"
          tar -czf "$name" -C bundle .
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'mkdir -p /home/budgetify/incoming'
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes "$name" scripts/deploy-website.sh "$VPS_USER@$VPS_HOST:/home/budgetify/incoming/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "bash /home/budgetify/incoming/deploy-website.sh /home/budgetify/incoming/$name"
